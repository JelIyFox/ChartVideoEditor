name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and add Android
        run: |
          npm install
          mkdir -p www
          cp index.html www/index.html
          npx cap add android
      - name: Icon
        run: |
          if [ -f icon.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in android/app/src/main/res/mipmap-*; do
              cp icon.png "$d/ic_launcher.png"
              cp icon.png "$d/ic_launcher_round.png"
            done
          fi
      - name: Save-to-Download bridge
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/></manifest>#' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/chartvideo/editor/MainActivity.java <<'EOF2'
          package com.chartvideo.editor;

          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 23 && Build.VERSION.SDK_INT < 29
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, 1);
                  }
                  getBridge().getWebView().addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public String save(String name, String data) {
                          try {
                              byte[] bytes = data.getBytes("UTF-8");
                              if (Build.VERSION.SDK_INT >= 29) {
                                  ContentResolver r = getContentResolver();
                                  Uri col = MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                                  Uri u = null;
                                  Cursor c = r.query(col, new String[]{MediaStore.MediaColumns._ID},
                                          MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + "=?",
                                          new String[]{name, "Download/"}, null);
                                  if (c != null) {
                                      if (c.moveToFirst()) u = ContentUris.withAppendedId(col, c.getLong(0));
                                      c.close();
                                  }
                                  if (u == null) {
                                      ContentValues v = new ContentValues();
                                      v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                                      v.put(MediaStore.MediaColumns.MIME_TYPE, "application/json");
                                      v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                                      u = r.insert(col, v);
                                  }
                                  OutputStream o = r.openOutputStream(u, "wt");
                                  o.write(bytes);
                                  o.close();
                                  return "Download/" + name;
                              } else {
                                  File d = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                  d.mkdirs();
                                  File f = new File(d, name);
                                  FileOutputStream o = new FileOutputStream(f);
                                  o.write(bytes);
                                  o.close();
                                  return f.getAbsolutePath();
                              }
                          } catch (Exception e) {
                              return "ERR:" + e;
                          }
                      }
                  }, "Android");
              }
          }
          EOF2
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChartVideoEditor-apk
          path: android/app/build/outputs/apk/debug/*.apk
